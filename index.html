<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>+Evolução</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="shortcut icon"
      href="rota/frontend/assets/favicon.ico"
      type="image/x-icon"
    />
  </head>
  <body>
    <img id="logo" src="rota/frontend/assets/header-idnex.png" alt="" />
    <div id="container">
      <div id="left">
        <h1>
          <img src="rota/frontend/assets/group-316.png" alt="+Evolução" />
        </h1>
        <div id="form">
          <form id="login-form" action="">
            <div id="container-inputs">
              <div class="inp" id="um">
                <img src="rota/frontend/assets/email-form.svg" alt="" />
                <input type="email" id="email" placeholder="Digite seu login" />
              </div>
              <div class="inp" id="dois">
                <img src="rota/frontend/assets/lock-form.svg" alt="" />
                <input
                  type="password"
                  id="senha"
                  placeholder="Digite sua senha"
                />
              </div>
            </div>
            <a href="#" id="forgot">Esqueci minha senha</a>
            <button id="btn1" type="submit">Entrar</button>
          </form>
        </div>
      </div>
      <div id="right"></div>
    </div>
    <footer>
      <a href="index.html"
        ><img src="rota/frontend/assets/image 10.png" alt="Institito J&F"
      /></a>
    </footer>
    <script src="rota/frontend/login.js"></script>
  </body>
</html>
