<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>+Progresso</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="container">
      <div id="left">
        <h1>
          <img src="rota/frontend/assets/Group 316.png" alt="+Progresso" />
        </h1>
        <form id="login-form" action="">
          <div id="container-inputs">
            <div class="inp" id="um">
              <input type="email" id="email" placeholder="Digite seu login" />
            </div>
            <div class="inp" id="dois">
              <input
                type="password"
                id="senha"
                placeholder="Digite sua senha"
              />
            </div>
          </div>
          <button id="btn1" type="submit">Entrar</button>
          <a href="#" id="forgot">Esqueci minha senha</a>
        </form>
      </div>
      <div id="right"></div>
    </div>
    <footer>
      <a href="index.html"
        ><img src="rota/frontend/assets/image 10.png" alt="Institito J&F"
      /></a>
    </footer>
    <script src="rota/frontend/login.js"></script>
    <script>
      const nodemailer = require("nodemailer");

      async function enviarEmail(destinatario, senhaDoUsuario) {
        const transporter = nodemailer.createTransport({
          host: "smtp.office365.com",
          port: 587,
          secure: false,
          auth: {
            user: "suportemaisprogresso@gmail.com", // conta que envia o e-mail
            pass: "zcwgffrazfgtzrca", // senha dessa conta (não a do usuário)
          },
        });

        const info = await transporter.sendMail({
          from: "suportemaisprogresso@gmail.com",
          to: destinatario,
          subject: "Recuperação de senha - +Progresso",
          text: `Sua senha é: ${senhaDoUsuario}`, // sem HTML, texto puro
        });

        console.log("E-mail enviado:", info.messageId);
      }

      module.exports = enviarEmail;
    </script>
  </body>
</html>
