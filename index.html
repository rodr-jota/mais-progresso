<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>+Progresso</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="container">
      <div id="left">
        <h1>
          <img src="rota/frontend/assets/Group 316.png" alt="+Progresso" />
        </h1>
        <form id="login-form" action="">
          <div id="container-inputs">
            <div class="inp" id="um">
              <input type="email" id="email" placeholder="Digite seu login" />
            </div>
            <div class="inp" id="dois">
              <input
                type="password"
                id="senha"
                placeholder="Digite sua senha"
              />
            </div>
          </div>
          <button id="btn1" type="submit">Entrar</button>
          <a href="#" id="forgot">Esqueci minha senha</a>
        </form>
      </div>
      <div id="right"></div>
    </div>
    <footer>
      <a href="index.html"
        ><img src="rota/frontend/assets/image 10.png" alt="Institito J&F"
      /></a>
    </footer>
    <script src="rota/frontend/login.js"></script>
    <script>
      async function enviarEmail(destinatario, assunto, corpo, accessToken) {
        const email = {
          message: {
            subject: assunto,
            body: {
              contentType: "Text",
              content: corpo,
            },
            toRecipients: [
              {
                emailAddress: {
                  address: destinatario,
                },
              },
            ],
          },
          saveToSentItems: true,
        };

        const response = await fetch(
          "https://graph.microsoft.com/v1.0/me/sendMail",
          {
            method: "POST",
            headers: {
              Authorization: `Bearer ${accessToken}`,
              "Content-Type": "application/json",
            },
            body: JSON.stringify(email),
          },
        );

        if (!response.ok) {
          const erro = await response.text();
          throw new Error(
            `Erro ao enviar e-mail: ${response.status} - ${erro}`,
          );
        }

        console.log("E-mail enviado com sucesso!");
      }

      document
        .getElementById("forgot")
        .addEventListener("click", async function (e) {
          e.preventDefault();

          const emailInput = document.getElementById("email").value;

          if (!emailInput) {
            alert(
              "Por favor, digite seu e-mail no campo de login antes de clicar em 'Esqueci minha senha'.",
            );
            return;
          }

          const accessToken = "SEU_ACCESS_TOKEN_AQUI"; // TODO: obter token via MSAL ou backend

          try {
            await enviarEmail(
              emailInput,
              "Recuperação de senha - +Progresso",
              "Você solicitou a recuperação de senha. Siga as instruções para redefinir sua senha.",
              accessToken,
            );
            alert("E-mail de recuperação enviado com sucesso!");
          } catch (erro) {
            console.error(erro);
            alert(
              "Não foi possível enviar o e-mail. Tente novamente mais tarde.",
            );
          }
        });
    </script>
  </body>
</html>
